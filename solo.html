<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Auto Pets · 单机版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===================== 顶栏 ===================== -->
  <header id="topbar">
    <div class="tb-stat">
      <span class="tb-k">回合</span>
      <span class="tb-v" id="turnNum">1</span>
    </div>
    <div class="tb-stat gold">
      <span class="tb-k">金币</span>
      <span class="tb-v" id="goldNum">10</span>
    </div>
    <div class="tb-stat">
      <span class="tb-k">战绩</span>
      <span class="tb-v"><span id="winNum" class="win">0</span><span class="sep">胜</span><span id="loseNum" class="lose">0</span><span class="sep">败</span></span>
    </div>
    <div class="tb-goal">
      <a class="back-link" href="index.html">← 返回模式选择</a>
      <span>目标 <b id="goalWins">10</b> 胜 ・ 上限 <b id="goalLoses">3</b> 败</span>
    </div>
    <button id="btnBoard" class="btn tiny">🏆 排行榜</button>
    <button id="btnCodex" class="btn tiny">📖 图鉴</button>
  </header>

  <div id="message"></div>

  <!-- ===================== 种子 / 每日挑战 ===================== -->
  <div id="seedBar" class="seed-bar"></div>


  <!-- 已获得的遗物 -->
  <div id="relicBar" class="relic-bar"></div>

  <!-- 已激活的阵营羁绊 -->
  <div id="synergyBar" class="synergy-bar"></div>

  <!-- ===================== 主区域 ===================== -->
  <main id="board">

    <!-- ===================== 战斗 =====================
         布局照官方：对手在上 / 中间交战区 / 我方在下。
         #foeRow 原来是放在 battlePanel 外面的独立 section，现在收进战场里。 -->
    <section id="battlePanel" style="display:none">
      <div class="arena">
        <div class="arena-side">
          <div class="arena-label">对手</div>
          <div id="foeRow" class="pet-row arena-row-foe"></div>
        </div>
        <div class="arena-clash"><span id="clashMark">⚔</span></div>
        <div class="arena-side">
          <div class="arena-label mine">我的队伍</div>
          <div id="myBattleRow" class="pet-row arena-row-mine"></div>
        </div>
      </div>
      <div class="battle-ctrl">
        <div id="battleLabel" class="battle-label"></div>
        <div class="battle-btns">
          <div class="speed-ctl" id="speedCtl">
            <button class="spd" data-speed="0.5">0.5×</button>
            <button class="spd active" data-speed="1">1×</button>
            <button class="spd" data-speed="2">2×</button>
            <button class="spd" data-speed="4">4×</button>
          </div>
          <button id="btnSkip" class="btn">⏩ 跳过动画</button>
          <button id="btnNext" class="btn primary" style="display:none"></button>
        </div>
      </div>
    </section>

    <!-- 商店：我的队伍 -->
    <section id="myRowWrap" class="row-wrap">
      <div class="row-label">
        我的队伍
        <span class="sub">拖拽调整顺序 · 点两次出售</span>
      </div>
      <div id="myRow" class="pet-row"></div>
    </section>

  </main>

  <!-- ===================== 商店 ===================== -->
  <section id="shop">
    <div class="shop-head">
      <h3>商店 <span id="shopTierBadge" class="shop-tier-badge">等级 1</span></h3>
      <div id="hint" class="hint"></div>
    </div>
    <!-- 商店阶段技能触发的汇总提示（回合开始 / 结束 / 买卖带出的效果） -->
    <div id="shopNotes" class="shop-notes" style="display:none"></div>

    <div class="shop-cols">
      <div class="shop-col">
        <div class="col-label">宠物（3 金）</div>
        <div id="shopPets" class="slot-row"></div>
      </div>
      <div class="shop-col narrow">
        <div class="col-label">道具（3 金）</div>
        <div id="shopFoods" class="slot-row"></div>
      </div>
    </div>

    <div class="actions">
      <button id="btnRoll" class="btn">🎲 刷新（1 金）</button>
      <button id="btnEnd" class="btn primary">⚔️ 结束回合，开打！</button>
    </div>
  </section>

  <!-- ===================== 图鉴（宠物 / 召唤物 / 道具 / 遗物） ===================== -->
  <div id="codex" class="codex-overlay" style="display:none">
    <div class="codex-panel">
      <div class="codex-head">
        <h2>📖 图鉴</h2>
        <span class="codex-sub" id="codexSub"></span>
        <button id="btnCodexClose" class="btn">✕ 关闭</button>
      </div>
      <div id="codexBody" class="codex-body"></div>
    </div>
  </div>
  <!-- ===================== 遗物三选一 ===================== -->
  <div id="relicPick" class="codex-overlay" style="display:none">
    <div class="relic-panel">
      <h2>✨ 选择一件遗物</h2>
      <p class="relic-hint">三选一，永久生效</p>
      <div id="relicChoices" class="relic-grid"></div>
    </div>
  </div>

</div>

<script src="js/rng.js"></script>
<script src="js/data.js"></script>
<script src="js/factions.js"></script>
<script src="js/render.js"></script>
<script src="js/relics.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
<script src="js/pack.js"></script>
<script src="js/badwords.js"></script>
<script src="js/board.js"></script>
<script src="js/board-ui.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
