<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Auto Pets · 单机版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="home">

  <header class="home-head">
    <h1>🐾 Super Auto Pets</h1>
    <p class="home-sub">选择一个模式开始</p>
  </header>

  <div class="mode-grid">

    <a class="mode-card" href="solo.html">
      <div class="mode-icon">🎯</div>
      <div class="mode-name">经典模式</div>
      <div class="mode-desc">
        <b>10 胜</b>通关 · <b>3 败</b>出局<br>
        每回合 10 金（不累积）<br>
        对手按回合强度生成
      </div>
      <div class="mode-tag">单人闯关</div>
    </a>

    <a class="mode-card accent" href="melee.html">
      <div class="mode-icon">⚔️</div>
      <div class="mode-name">8 人混战</div>
      <div class="mode-desc">
        你和 <b>7 个人机</b>同场竞技<br>
        每回合两两配对，输一场扣血<br>
        <b>活到最后</b>就是赢家
      </div>
      <div class="mode-tag">大逃杀</div>
    </a>

  </div>

  <div class="home-foot">
    61 只宠物 · 7 种召唤物 · 11 种道具 &nbsp;|&nbsp; 双击即玩，无需安装
  </div>

</div>
