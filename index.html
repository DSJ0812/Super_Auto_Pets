<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Auto Pets · 单机版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="home">

  <header class="home-head">
    <h1>🐾 Super Auto Pets</h1>
    <p class="home-sub">选择一个模式开始</p>
  </header>

  <!-- 宠物包：一局只用一个包（两个包混进同一个池子会把重复率砍半，
       合成升级会变得几乎不可能），所以这里选一次，三个模式都跟着走 -->
  <div class="pack-pick">
    <span class="pp-label">宠物包</span>
    <button class="pp-btn active" data-pack="turtle">🐢 龟包 <b>61</b> 只</button>
    <button class="pp-btn" data-pack="star">⭐ 星包 <b>67</b> 只</button>
    <span class="pp-note" id="packNote">经典 Turtle Pack</span>
  </div>

  <div class="mode-grid">

    <a class="mode-card" id="cardSolo" href="solo.html">
      <div class="mode-icon">🎯</div>
      <div class="mode-name">经典模式</div>
      <div class="mode-desc">
        <b>10 胜</b>通关 · <b>3 败</b>出局<br>
        每回合 10 金（不累积）<br>
        对手按回合强度生成
      </div>
      <div class="mode-tag">单人闯关</div>
    </a>

    <a class="mode-card accent" id="cardMelee" href="melee.html">
      <div class="mode-icon">⚔️</div>
      <div class="mode-name">8 人混战</div>
      <div class="mode-desc">
        你和 <b>7 个人机</b>同场竞技<br>
        每回合两两配对，输一场扣血<br>
        <b>活到最后</b>就是赢家
      </div>
      <div class="mode-tag">大逃杀</div>
    </a>

    <!-- 只有检测到联机服务器时才显示（见页面底部脚本） -->
    <a class="mode-card online" href="online.html" id="onlineCard" style="display:none">
      <div class="mode-icon">🌐</div>
      <div class="mode-name">联机混战</div>
      <div class="mode-desc">
        和 <b>朋友同场</b>，最多 8 人<br>
        人不够由电脑补位<br>
        同一个 WiFi 就能玩
      </div>
      <div class="mode-tag">局域网</div>
    </a>

    <a class="mode-card daily" id="cardDaily" href="solo.html?daily=1">
      <div class="mode-icon">📅</div>
      <div class="mode-name">每日挑战</div>
      <div class="mode-desc">
        <b>同一天所有人同一局</b><br>
        种子由日期决定，可以反复重玩<br>
        <span id="dailyDate" class="daily-date"></span>
      </div>
      <div class="mode-tag" id="dailyTag">按日期</div>
    </a>

  </div>

  <div class="home-foot" id="homeFoot">
    龟包 61 只 + 星包 67 只 · 7 种召唤物 · 道具 &nbsp;|&nbsp; 打开即玩，无需安装
  </div>

</div>

<script src="js/rng.js"></script>
<script>
/* 宠物包选择：选中的包会写进三个模式卡片的链接（?pack=xxx）。
 * 一局只用一个包 —— 两个包混进同一个池子会把重复率砍半，
 * 而 SAP 的升级完全依赖反复出现同名宠物。 */
(function () {
  var PACKS = {
    turtle: { icon: '🐢', cn: '龟包', note: '经典 Turtle Pack', count: 61 },
    star:   { icon: '⭐', cn: '星包', note: 'Star Pack（官方第二个包）', count: 67 }
  };
  var cur = 'turtle';
  var btns = document.querySelectorAll('.pp-btn');

  function apply() {
    var q = cur === 'turtle' ? '' : ('?pack=' + cur);
    document.getElementById('cardSolo').href = 'solo.html' + q;
    document.getElementById('cardMelee').href = 'melee.html' + q;
    document.getElementById('cardDaily').href = 'solo.html?daily=1' +
      (cur === 'turtle' ? '' : '&pack=' + cur);
    document.getElementById('packNote').textContent = PACKS[cur].note;
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].dataset.pack === cur);
    }
  }
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      cur = this.dataset.pack;
      if (!PACKS[cur]) cur = 'turtle';
      apply();
    });
  }
  apply();
})();

/* 联机入口只在「真的有服务器」时出现。
 *
 * 这样同一份 index.html 能同时服务两种场景：
 *   · 从局域网服务器打开（主持人开了 开服.bat）→ 探测到 /api/ping → 显示联机
 *   · 从公网静态托管打开（发链接给别人自己玩）  → 探测失败      → 只有单机
 * 静态托管上 /api/ping 通常返回 404 或一份 HTML，
 * 所以必须校验返回内容里确实有 online:true，不能只看状态码。
 */
(function () {
  var card = document.getElementById('onlineCard');
  var foot = document.getElementById('homeFoot');
  var base = '龟包 61 只 + 星包 67 只 · 7 种召唤物 · 道具';
  // 同一份 index.html 会用在两种场景：file:// 双击打开、以及网页链接打开，
  // 所以文案用「打开即玩」而不是「双击即玩」
  var offlineFoot = base + ' &nbsp;|&nbsp; 打开即玩，无需安装' +
    '<br><span style="font-size:11.5px;opacity:.75">' +
    '想和朋友联机？在主机上双击 <b>开服.bat</b>，用它显示的地址打开本页即可。</span>';

  /* 每日挑战卡片：显示今天的日期和成绩 */
  try {
    var key = RNG.dailySeed();
    var d = key.replace('daily-', '');
    document.getElementById('dailyDate').textContent = d;
    var rec = null;
    try { rec = JSON.parse(localStorage.getItem('sap_daily_' + key) || 'null'); } catch (e) {}
    var tag = document.getElementById('dailyTag');
    if (rec && rec.plays) {
      tag.textContent = '已玩 ' + rec.plays + ' 局';
      if (rec.best) {
        document.getElementById('dailyDate').textContent =
          d + ' · 最好 ' + rec.best.wins + ' 胜' + (rec.best.win ? ' 🏆' : '');
      }
    }
  } catch (e) { /* 种子算不出来就不显示日期，不影响别的 */ }

  fetch('api/ping', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (j && j.online === true) {
        card.style.display = '';
        foot.innerHTML = base + ' &nbsp;|&nbsp; 🌐 已连接联机服务器，可以和朋友一起玩';
      } else {
        foot.innerHTML = offlineFoot;
      }
    })
    .catch(function () { foot.innerHTML = offlineFoot; });
})();
</script>
</body>
</html>
